name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # File di repo sengaja datar semua di satu folder (mudah di-upload dari HP).
      # Langkah ini menyusunnya jadi struktur project Android standar.
      - name: Susun struktur project
        run: |
          mkdir -p app/src/main/java/com/camotv/app app/src/main/assets
          cp app.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt PlayerActivity.kt app/src/main/java/com/camotv/app/
          cp index.html app/src/main/assets/index.html

      - name: Build APK (debug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CAMO-TV-apk
          path: app/build/outputs/apk/debug/*.apk
